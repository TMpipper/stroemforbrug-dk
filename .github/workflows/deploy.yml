# Daglig udgivelse og deploy ved push — kun via Vercel CLI (git-deploy er slået fra i vercel.json).
# Hver morgen efter el-feeds natlige job: audits bygger med dagens priser, og dato-gatede sider (publishDate) går live.
# Kræver repo-hemmeligheden VERCEL_TOKEN (Vercel → Account → Tokens, scope mondomedia). Uden den springes deployet over.
name: Audit og deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_Au1eyarKL6RSFVSFhZnfbmU1
  VERCEL_PROJECT_ID: prj_2hpALAsXKz2TnlAWui33KANLaJCv
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  EL_FEED_URL: https://el-feed.vercel.app
  SITE_DOMAIN: stroemforbrug.dk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mangler VERCEL_TOKEN?
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN er ikke sat som repo-hemmelighed — bygger og auditerer, men deployer ikke."
      - name: Vercel pull (produktionsmiljø)
        if: env.VERCEL_TOKEN != ''
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Løberen (16 GB) blev dræbt midt i den statiske generering ved 300+ sider (»runner has received a shutdown signal«,
      # 23.–25. nov. 2026, ca. hvert andet byg). Ekstra swap gør en hukommelsestop langsom i stedet for dødelig.
      # 26. nov.: 8 GB rakte til 334 sider (2 GB brugt), men 336 sider brugte 5,6 GB — nu 14 GB, mens årsagen findes.
      - name: Ekstra swap (14 GB)
        run: |
          sudo fallocate -l 14G /swapfile-extra && sudo chmod 600 /swapfile-extra && sudo mkswap /swapfile-extra >/dev/null && sudo swapon /swapfile-extra
          free -m
      - name: Byg (prebuild + next build + postbuild-audits)
        # Eget loft under jobbets 30 min: hænger bygget, fejler trinnet med log i stedet for at jobbet annulleres uden (23. nov. 2026).
        timeout-minutes: 20
        env:
          # Lavere heap-loft pr. worker, så Node rydder op tidligere i stedet for at vokse mod maskinens grænse.
          NODE_OPTIONS: --max-old-space-size=2048
          # 26. nov.: workerne voksede til ~6 GB RSS på Linux trods 2 GB heap (lokalt på macOS ≤ 1,5 GB) — hukommelse uden for
          # heapen, typisk glibc-arenaer. Færre arenaer holder RSS nede.
          MALLOC_ARENA_MAX: "2"
        run: |
          # Hukommelseslog hvert 10. s, så næste fejl viser tallene (brugt/ledig/swap i MB).
          # + de tre største processer (RSS i MB og kommandoens start), så det kan ses, HVAD der vokser.
          (while true; do free -m | awk 'NR==2{u=$3;a=$7} NR==3{s=$3} END{printf "MEM used=%s avail=%s swap=%s\n",u,a,s}'; ps -eo rss=,args= --sort=-rss | head -3 | awk '{printf "  TOP %d MB %s %s %s\n",$1/1024,$2,$3,$4}'; sleep 10; done) &
          if [ -n "$VERCEL_TOKEN" ]; then npx vercel build --prod --token="$VERCEL_TOKEN"; else npm run build; fi
      - name: Playwright til audit-mobile
        run: npx playwright install --with-deps chromium
      - name: Audits (lint, feed, priser, SEO, påstande, unikhed, widget, mobil)
        run: npm run audit
      - name: Deploy til produktion
        if: env.VERCEL_TOKEN != ''
        run: npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope mondomedia
      - name: Efter deploy (IndexNow)
        if: env.VERCEL_TOKEN != ''
        run: npm run post-deploy
